name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Copy env
        run: cp .env.testing .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Composer security audit (non-blocking)
        run: composer audit --no-interaction --format=plain || true
        continue-on-error: true

      - name: Install Node dependencies
        run: npm ci

      - name: NPM security audit (non-blocking)
        run: npm audit --omit=dev --audit-level=high || true
        continue-on-error: true

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Build assets
        run: npm run build

      - name: Run tests with coverage
        run: php artisan test --coverage-clover=coverage.xml

      - name: Coverage threshold check (non-blocking, warn below 70%)
        run: php artisan test --coverage-min=70 || echo "::warning::Coverage below 70% threshold — please improve test coverage"
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress
        continue-on-error: true
