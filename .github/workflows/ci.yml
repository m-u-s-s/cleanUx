name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # COMPOSER TÉLÉCHARGEAIT EN ANONYME, ET CELA A RENDU LA CI ROUGE TROIS FOIS DE SUITE.
  #
  # `codeload.github.com` limite les téléchargements anonymes PAR ADRESSE IP, et les exécuteurs
  # GitHub partagent des plages d'adresses : il suffit d'une pointe de charge globale pour que le
  # quota soit épuisé par d'autres. Le 2026-08-17, `composer install` est sorti en code 100 sur les
  # trois jobs avec « HTTP/2 429 » sur une quarantaine de paquets, avant qu'un seul test ne démarre.
  #
  # `GITHUB_TOKEN` est fourni d'office par Actions — aucun secret à configurer, et ce dépôt n'en a
  # aucun. Authentifier relève nettement le quota.
  #
  # CE QUE CELA NE COUVRE PAS, ET IL FAUT LE DIRE : le premier échec de la journée portait sur le
  # téléchargement de l'ACTION `setup-php` elle-même, à l'étape « Set up job », avant que la moindre
  # ligne de ce dépôt ne s'exécute. Aucun réglage ici n'y peut quoi que ce soit.
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  quality:
    name: Quality gate (validate, pint, phpstan, tests, build)
    timeout-minutes: 150
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          # XDEBUG N'EST CHARGÉ QUE LÀ OÙ LA COUVERTURE EST MESURÉE (2026-08-06).
          #
          # Il ne sert QU'À cela, mais une fois chargé il ralentit TOUTE exécution PHP — d'un
          # facteur ~3 sur cette suite. C'est lui, et non la mesure elle-même, qui faisait passer
          # ce job de ~20 min à 53-70 min.
          #
          # `push` ne se déclenche que sur main/master (voir `on:` en tête de fichier) : la
          # couverture reste donc entière sur la branche d'intégration, et disparaît des PR.
          coverage: ${{ github.event_name == 'push' && 'xdebug' || 'none' }}
          ini-values: memory_limit=-1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Copy env
        run: cp .env.testing .env

      # ON DEMANDE LE CHEMIN À COMPOSER PLUTÔT QUE DE LE DEVINER : il dépend de `COMPOSER_HOME`
      # et des variables XDG de l'image, et un cache posé au mauvais endroit rate en silence —
      # le job resterait vert tout en retéléchargeant tout, c'est-à-dire sans rien corriger.
      - name: Où Composer range ses téléchargements
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # LE CACHE EST LA VRAIE PARADE AU 429 : sur succès, `composer install` ne demande RIEN à
      # `codeload.github.com`. L'authentification relève le quota, le cache évite d'y toucher.
      # La clé porte le verrou : elle change dès qu'une dépendance bouge, et la clé de repli
      # récupère le cache de la version précédente plutôt que de repartir de zéro.
      - name: Cache des téléchargements Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        # TROIS TENTATIVES ESPACÉES, PARCE QU'UN 429 EST TRANSITOIRE PAR DÉFINITION.
        #
        # Sans cela, une pointe de charge chez GitHub rend la CI rouge pour une raison qui n'a rien
        # à voir avec le code — et c'est ainsi qu'un rouge devient du bruit qu'on cesse de lire.
        # L'attente croît entre les essais : réessayer aussitôt frapperait le même quota épuisé.
        #
        # La boucle ne masque pas une panne réelle : après trois échecs, l'étape sort en erreur.
        run: |
          for tentative in 1 2 3; do
            if composer install --no-interaction --prefer-dist; then
              exit 0
            fi
            echo "::warning::composer install a échoué (tentative ${tentative}/3) — nouvel essai dans $((tentative * 20))s"
            sleep $((tentative * 20))
          done
          echo "::error::composer install a échoué après 3 tentatives"
          exit 1

      # ---- Fast static gates first (fail fast before the slow suite) ----
      - name: Composer manifest is valid and in sync with the lock file
        run: composer validate --strict

      - name: Composer security audit
        run: composer audit --no-interaction --format=plain --abandoned=report

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: NPM security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Build web assets
        run: npm run build

      # ---- Suite de tests ----
      #
      # DEUX RÉGIMES, POUR UNE SEULE RAISON : le coût.
      #
      # Sur une PULL REQUEST, la suite tourne NUE : mêmes tests, même verdict fonctionnel, sans
      # Xdebug ni mesure de couverture. C'est ce qui répond à la question « ce changement
      # casse-t-il quelque chose ? », et cela prend environ trois fois moins de temps.
      #
      # Sur MAIN, la couverture est mesurée et le seuil de 80% appliqué. Le portail reste donc
      # entier là où il protège réellement — à l'entrée de la branche d'intégration.
      #
      # Ce que l'on accepte en échange : une PR qui ferait chuter la couverture sous 80% ne sera
      # signalée qu'après fusion, sur main. C'est un décalage assumé, pas une suppression.
      - name: Run tests (pull request — sans couverture)
        if: github.event_name == 'pull_request'
        run: php artisan test

      - name: Run tests with coverage (fail below 80%)
        if: github.event_name == 'push'
        run: php artisan test --coverage --min=80 --coverage-clover=coverage.xml

      - name: Upload coverage report
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # M25 — the default suite runs on SQLite with FKs disabled. This job re-runs the money /
  # GDPR / spine suites against MySQL with foreign-key enforcement ON, so referential-integrity
  # bugs (orphan rows, wrong FKs) that SQLite silently allows are caught. Scoped to the
  # well-formed money/compliance suites rather than the whole suite.
  money-integrity-mysql:
    name: Money/GDPR integrity (MySQL, FK enforced)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # BLOQUANT depuis le 2026-08-13, et c'est le point de ce job.
    #
    # Il était non bloquant le temps d'épuiser les défauts MySQL préexistants. Ce périmètre est
    # désormais vert sur MySQL (236 tests), et le laisser passif lui retirait sa seule utilité :
    # il est le SEUL endroit qui voit ce que SQLite cache. La réconciliation Stripe a rendu zéro
    # anomalie pendant trois jours parce qu'une colonne supprimée y était encore interrogée —
    # SQLite traite un identifiant inconnu entre guillemets doubles comme une chaîne littérale et
    # ne lève rien, MySQL refuse. Ce job l'avait signalé ; son rouge ne bloquait personne.

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: brio_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: brio_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_FOREIGN_KEYS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_mysql, mysql
          ini-values: memory_limit=-1

      - name: Copy env
        run: cp .env.testing .env

      # ON DEMANDE LE CHEMIN À COMPOSER PLUTÔT QUE DE LE DEVINER : il dépend de `COMPOSER_HOME`
      # et des variables XDG de l'image, et un cache posé au mauvais endroit rate en silence —
      # le job resterait vert tout en retéléchargeant tout, c'est-à-dire sans rien corriger.
      - name: Où Composer range ses téléchargements
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # LE CACHE EST LA VRAIE PARADE AU 429 : sur succès, `composer install` ne demande RIEN à
      # `codeload.github.com`. L'authentification relève le quota, le cache évite d'y toucher.
      # La clé porte le verrou : elle change dès qu'une dépendance bouge, et la clé de repli
      # récupère le cache de la version précédente plutôt que de repartir de zéro.
      - name: Cache des téléchargements Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        # TROIS TENTATIVES ESPACÉES, PARCE QU'UN 429 EST TRANSITOIRE PAR DÉFINITION.
        #
        # Sans cela, une pointe de charge chez GitHub rend la CI rouge pour une raison qui n'a rien
        # à voir avec le code — et c'est ainsi qu'un rouge devient du bruit qu'on cesse de lire.
        # L'attente croît entre les essais : réessayer aussitôt frapperait le même quota épuisé.
        #
        # La boucle ne masque pas une panne réelle : après trois échecs, l'étape sort en erreur.
        run: |
          for tentative in 1 2 3; do
            if composer install --no-interaction --prefer-dist; then
              exit 0
            fi
            echo "::warning::composer install a échoué (tentative ${tentative}/3) — nouvel essai dans $((tentative * 20))s"
            sleep $((tentative * 20))
          done
          echo "::error::composer install a échoué après 3 tentatives"
          exit 1

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Migrate (MySQL)
        run: php artisan migrate --force

      # LES SEEDERS, SUR LE MOTEUR RÉEL — ET DEUX FOIS.
      #
      # `SeedersFonctionnentTest` couvre déjà cela, mais sur SQLite : l'angle mort connu de ce
      # dépôt. Trois familles de défauts ne se voient QUE sur MySQL — clé étrangère réellement
      # appliquée, mode strict qui refuse une valeur tronquée, limite de 64 caractères sur les
      # identifiants. Un seeder peut donc être vert dans la suite et casser une base de production.
      #
      # Le second passage est ce qui vérifie l'idempotence : sans lui, un `insert()` non gardé
      # passerait, puisqu'une base vierge ne peut pas montrer de doublon.
      - name: Seeders load twice on real MySQL (idempotent, FK enforced)
        run: |
          php artisan db:seed --force
          php artisan db:seed --force

      # `FaceCheck` entre ici pour la raison qui a fait naître ce job : la suite par défaut tourne
      # avec `DB_FOREIGN_KEYS=false`, et ce module pose six clés étrangères — dont deux
      # `nullOnDelete` sur `users` et une sur `provider_onboarding_documents`. Une contrainte mal
      # posée y resterait invisible jusqu'au jour où quelqu'un supprime un compte en production.
      - name: Money / GDPR / spine suites with FK enforcement
        run: |
          php artisan test \
            tests/Feature/Spine \
            tests/Feature/Payments \
            tests/Feature/PayoutFlowTest.php \
            tests/Feature/CancellationV2 \
            tests/Feature/Gdpr \
            tests/Feature/Kyc \
            tests/Feature/FaceCheck

  # E2E par rôle (Playwright) — boote l'app sur SQLite fichier + comptes QA, et
  # vérifie en navigateur que chaque rôle se connecte et atteint son espace.
  #
  # BLOQUANT DEPUIS LE 2026-08-17, et c'est la condition que ce commentaire posait lui-même :
  # « non-bloquant au départ (signal d'abord) ; passer en bloquant une fois stable ».
  #
  # STABILITÉ MESURÉE, PAS SUPPOSÉE : cinq exécutions vertes d'affilée sur main
  # (32029068668, 32031003557, 32032340155, 32033133325, 32038472780). Les trois rouges qui
  # suivent n'ont pas exercé une seule ligne de Playwright — `composer install` y sort en code 100
  # sur des « HTTP/2 429 » de `codeload.github.com`, une panne de quota chez GitHub que le cache
  # et les tentatives ajoutés le même jour visent précisément.
  #
  # POURQUOI CELA COMPTE PLUS QUE LE RESTE DU PORTAIL. C'est la SEULE vérification qui ouvre un
  # navigateur et prouve qu'un rôle se connecte et atteint son espace : ni PHPStan ni la suite ne
  # voient un écran injoignable, et ce dépôt l'a payé plusieurs fois — des méthodes Livewire
  # qu'aucune vue n'appelait, des écrans mobiles que rien ne relie. Laissée passive, elle pouvait
  # rester rouge des semaines sans que personne le remarque : c'est exactement le mécanisme qui a
  # gardé cette CI structurellement rouge pendant des mois.
  e2e:
    name: E2E (Playwright, per role)
    timeout-minutes: 25
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/e2e.sqlite
      DB_FOREIGN_KEYS: 'true'
      APP_ENV: local
      APP_DEBUG: 'true'
      E2E_BASE_URL: http://127.0.0.1:8000
      # Le job copie .env.testing, taillé pour PHPUnit : là, chaque test est un processus unique
      # et une session en mémoire suffit. Ici l'application est servie en HTTP et le navigateur
      # enchaîne de VRAIES requêtes : avec `array`, la session est jetée à la fin de chacune, le
      # jeton CSRF posé sur GET /login n'existe plus au POST — 419 — et une connexion réussie ne
      # survivrait de toute façon pas à la redirection. C'est pour cela que les cinq rôles
      # échouaient au login.
      SESSION_DRIVER: file
      CACHE_STORE: file
      # L'URL de l'application doit désigner le serveur réellement joint, sinon les redirections
      # absolues renvoient ailleurs que là où le navigateur se trouve.
      APP_URL: http://127.0.0.1:8000
      # Ce job vérifie l'ACCÈS PAR RÔLE, pas le parcours de double authentification. Exigée des
      # admins par défaut, elle renvoie le compte de vérification vers son profil — et un
      # navigateur ne peut pas répondre à un défi TOTP. On la désactive donc ici, ce qui rend le
      # test de l'espace admin réellement significatif au lieu de le voir passer sur un renvoi.
      ENFORCE_2FA_FOR_ADMINS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          ini-values: memory_limit=-1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Copy env
        run: cp .env.testing .env

      # ON DEMANDE LE CHEMIN À COMPOSER PLUTÔT QUE DE LE DEVINER : il dépend de `COMPOSER_HOME`
      # et des variables XDG de l'image, et un cache posé au mauvais endroit rate en silence —
      # le job resterait vert tout en retéléchargeant tout, c'est-à-dire sans rien corriger.
      - name: Où Composer range ses téléchargements
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # LE CACHE EST LA VRAIE PARADE AU 429 : sur succès, `composer install` ne demande RIEN à
      # `codeload.github.com`. L'authentification relève le quota, le cache évite d'y toucher.
      # La clé porte le verrou : elle change dès qu'une dépendance bouge, et la clé de repli
      # récupère le cache de la version précédente plutôt que de repartir de zéro.
      - name: Cache des téléchargements Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        # TROIS TENTATIVES ESPACÉES, PARCE QU'UN 429 EST TRANSITOIRE PAR DÉFINITION.
        #
        # Sans cela, une pointe de charge chez GitHub rend la CI rouge pour une raison qui n'a rien
        # à voir avec le code — et c'est ainsi qu'un rouge devient du bruit qu'on cesse de lire.
        # L'attente croît entre les essais : réessayer aussitôt frapperait le même quota épuisé.
        #
        # La boucle ne masque pas une panne réelle : après trois échecs, l'étape sort en erreur.
        run: |
          for tentative in 1 2 3; do
            if composer install --no-interaction --prefer-dist; then
              exit 0
            fi
            echo "::warning::composer install a échoué (tentative ${tentative}/3) — nouvel essai dans $((tentative * 20))s"
            sleep $((tentative * 20))
          done
          echo "::error::composer install a échoué après 3 tentatives"
          exit 1

      - name: Install Node dependencies
        run: npm ci

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Prepare SQLite database
        run: touch "$DB_DATABASE"

      - name: Migrate + seed QA accounts
        run: |
          php artisan migrate --force
          php artisan db:seed --class="Database\\Seeders\\QaAccountsSeeder" --force

      - name: Build web assets
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the app
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Wait for the app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/login >/dev/null; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "app did not start" && exit 1

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
