name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality gate (validate, pint, phpstan, tests, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Copy env
        run: cp .env.testing .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      # ---- Fast static gates first (fail fast before the slow suite) ----
      - name: Composer manifest is valid and in sync with the lock file
        run: composer validate --strict

      - name: Composer security audit
        run: composer audit --no-interaction --format=plain --abandoned=report

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: NPM security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Build web assets
        run: npm run build

      # ---- Test suite + coverage gate (single run) ----
      - name: Run tests with coverage (fail below 80%)
        run: php artisan test --coverage-clover=coverage.xml --coverage-min=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
