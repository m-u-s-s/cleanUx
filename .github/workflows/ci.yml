name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality gate (validate, pint, phpstan, tests, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: xdebug
          ini-values: memory_limit=-1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Copy env
        run: cp .env.testing .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      # ---- Fast static gates first (fail fast before the slow suite) ----
      - name: Composer manifest is valid and in sync with the lock file
        run: composer validate --strict

      - name: Composer security audit
        run: composer audit --no-interaction --format=plain --abandoned=report

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: NPM security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Build web assets
        run: npm run build

      # ---- Test suite + coverage gate (single run) ----
      - name: Run tests with coverage (fail below 80%)
        run: php artisan test --coverage --min=80 --coverage-clover=coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # M25 — the default suite runs on SQLite with FKs disabled. This job re-runs the money /
  # GDPR / spine suites against MySQL with foreign-key enforcement ON, so referential-integrity
  # bugs (orphan rows, wrong FKs) that SQLite silently allows are caught. Scoped to the
  # well-formed money/compliance suites rather than the whole suite.
  money-integrity-mysql:
    name: Money/GDPR integrity (MySQL, FK enforced)
    runs-on: ubuntu-latest
    # Non-blocking for now: this job runs the money/spine/GDPR/KYC suites on real MySQL with FK
    # enforcement and surfaces pre-existing MySQL-only issues (the suites were written against
    # SQLite). It reports signal but must not block merges until that backlog is burned down —
    # tracked in issue #5. Flip to blocking once these suites are MySQL-green.
    continue-on-error: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cleanux_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cleanux_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_FOREIGN_KEYS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_mysql, mysql
          ini-values: memory_limit=-1

      - name: Copy env
        run: cp .env.testing .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Migrate (MySQL)
        run: php artisan migrate --force

      - name: Money / GDPR / spine suites with FK enforcement
        run: |
          php artisan test \
            tests/Feature/Spine \
            tests/Feature/Payments \
            tests/Feature/PayoutFlowTest.php \
            tests/Feature/CancellationV2 \
            tests/Feature/Gdpr \
            tests/Feature/Kyc

  # E2E par rôle (Playwright) — boote l'app sur SQLite fichier + comptes QA, et
  # vérifie en navigateur que chaque rôle se connecte et atteint son espace.
  # Non-bloquant au départ (signal d'abord) ; passer en bloquant une fois stable.
  e2e:
    name: E2E (Playwright, per role)
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/e2e.sqlite
      DB_FOREIGN_KEYS: 'true'
      APP_ENV: local
      APP_DEBUG: 'true'
      E2E_BASE_URL: http://127.0.0.1:8000
      # Le job copie .env.testing, taillé pour PHPUnit : là, chaque test est un processus unique
      # et une session en mémoire suffit. Ici l'application est servie en HTTP et le navigateur
      # enchaîne de VRAIES requêtes : avec `array`, la session est jetée à la fin de chacune, le
      # jeton CSRF posé sur GET /login n'existe plus au POST — 419 — et une connexion réussie ne
      # survivrait de toute façon pas à la redirection. C'est pour cela que les cinq rôles
      # échouaient au login.
      SESSION_DRIVER: file
      CACHE_STORE: file
      # L'URL de l'application doit désigner le serveur réellement joint, sinon les redirections
      # absolues renvoient ailleurs que là où le navigateur se trouve.
      APP_URL: http://127.0.0.1:8000
      # Ce job vérifie l'ACCÈS PAR RÔLE, pas le parcours de double authentification. Exigée des
      # admins par défaut, elle renvoie le compte de vérification vers son profil — et un
      # navigateur ne peut pas répondre à un défi TOTP. On la désactive donc ici, ce qui rend le
      # test de l'espace admin réellement significatif au lieu de le voir passer sur un renvoi.
      ENFORCE_2FA_FOR_ADMINS: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          ini-values: memory_limit=-1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Copy env
        run: cp .env.testing .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Prepare SQLite database
        run: touch "$DB_DATABASE"

      - name: Migrate + seed QA accounts
        run: |
          php artisan migrate --force
          php artisan db:seed --class="Database\\Seeders\\QaAccountsSeeder" --force

      - name: Build web assets
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the app
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Wait for the app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/login >/dev/null; then echo "up"; exit 0; fi
            sleep 2
          done
          echo "app did not start" && exit 1

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
