name: Mobile Store Submit

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to submit'
        required: true
        type: choice
        options:
          - client
          - provider
      platform:
        description: 'Platform'
        required: true
        type: choice
        options:
          - android
          - ios

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  submit:
    name: Submit to Store
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/${{ github.event.inputs.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/${{ github.event.inputs.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit
        run: eas submit --profile production --platform ${{ github.event.inputs.platform }} --non-interactive
