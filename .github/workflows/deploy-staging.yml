name: Deploy Staging

on:
  push:
    branches: [develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # 8.5 comme la CI, et comme le serveur. Le plancher de `composer.json` est passé à
          # ^8.5 avec cette montée. Rappel de ce qui avait cassé : `composer.lock` contient des
          # paquets Symfony 8.1.x qui exigent php >= 8.4.1, et sur 8.3 `composer install`
          # refusait d'en installer douze — le déploiement échouait avant même l'étape SSH.
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          script: |
            set -e
            cd ${{ secrets.STAGING_PATH }}
            git pull origin develop
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            npm ci
            npm run build
            php artisan migrate --force
            php artisan db:seed --class=DemoDataSeeder --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan queue:restart
            php artisan reverb:restart || true
            echo "Staging deploy completed at $(date)"

      - name: Verify staging health endpoint
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.STAGING_HOST }}/api/health || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "Staging health check failed with status $STATUS"
            exit 1
          fi
          echo "Staging health check passed (HTTP $STATUS)"
