<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schéma — travail en cours</title>
<style>
  :root{
    --fond:#f6f5f2; --encre:#14161a; --doux:#6b7280; --trait:#e2e0da;
    --carte:#fffffe; --accent:#4f46e5; --or:#b8860b;
    --vert:#0f7b46; --ambre:#b45309; --gris:#9ca3af;
    --ombre:0 1px 2px rgba(20,22,26,.04), 0 8px 24px rgba(20,22,26,.06);
    --r:14px; --t:.28s cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --fond:#0d0f13; --encre:#f2f1ee; --doux:#9aa1ad; --trait:#22262e;
      --carte:#14171d; --accent:#8b85ff; --or:#d9a441;
      --vert:#4ade80; --ambre:#fbbf24; --gris:#6b7280;
      --ombre:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --fond:#0d0f13; --encre:#f2f1ee; --doux:#9aa1ad; --trait:#22262e;
    --carte:#14171d; --accent:#8b85ff; --or:#d9a441;
    --vert:#4ade80; --ambre:#fbbf24; --gris:#6b7280;
    --ombre:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--fond); color:var(--encre);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .enveloppe{max-width:1180px; margin:0 auto; padding:32px 20px 72px}
  header{display:flex; flex-wrap:wrap; gap:16px; align-items:baseline; justify-content:space-between; margin-bottom:28px}
  h1{font-size:clamp(22px,3.4vw,32px); font-weight:680; letter-spacing:-.022em; margin:0}
  .pouls{display:inline-flex; align-items:center; gap:8px; color:var(--doux); font-size:13px; font-variant-numeric:tabular-nums}
  .point{width:8px;height:8px;border-radius:50%;background:var(--vert);box-shadow:0 0 0 0 currentColor;animation:battre 2.4s infinite}
  @keyframes battre{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
  @media (prefers-reduced-motion:reduce){ .point{animation:none} *{transition:none!important} }

  .grille{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:28px}
  .kpi{background:var(--carte); border:1px solid var(--trait); border-radius:var(--r); padding:16px 18px; box-shadow:var(--ombre); min-width:0}
  .kpi b{display:block; font-size:26px; font-weight:660; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .kpi span{display:block; color:var(--doux); font-size:12px; text-transform:uppercase; letter-spacing:.07em; margin-top:4px}
  .kpi.alerte b{color:var(--ambre)}

  h2{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--doux); font-weight:640; margin:34px 0 12px}
  .bloc{background:var(--carte); border:1px solid var(--trait); border-radius:var(--r); box-shadow:var(--ombre); overflow:hidden}
  .ligne{display:flex; gap:14px; align-items:flex-start; padding:14px 18px; border-bottom:1px solid var(--trait)}
  .ligne:last-child{border-bottom:0}
  .puce{flex:0 0 auto; width:9px; height:9px; border-radius:50%; margin-top:7px; background:var(--gris)}
  .puce.fait{background:var(--vert)} .puce.encours{background:var(--ambre)} .puce.attente{background:var(--gris)}
  .ligne strong{font-weight:600} .ligne em{font-style:normal; color:var(--doux); display:block; font-size:13.5px; margin-top:2px}
  .etat{margin-left:auto; flex:0 0 auto; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--doux)}

  .chaud{display:flex; flex-wrap:wrap; gap:8px}
  .jeton{background:var(--carte); border:1px solid var(--trait); border-radius:999px; padding:7px 13px; font-size:13px; box-shadow:var(--ombre)}
  .jeton b{font-variant-numeric:tabular-nums; color:var(--accent)}

  ol.journal{list-style:none; margin:0; padding:0}
  ol.journal li{padding:12px 18px; border-bottom:1px solid var(--trait); font-size:14px}
  ol.journal li:last-child{border-bottom:0}
  ol.journal li::before{content:"·"; color:var(--or); font-weight:700; margin-right:10px}
  .vide{padding:18px; color:var(--doux); font-size:14px}
  footer{margin-top:34px; color:var(--doux); font-size:12.5px}
  code{background:color-mix(in oklab,var(--encre) 7%,transparent); padding:1px 6px; border-radius:6px; font-size:12.5px}
</style>
</head>
<body>
<div class="enveloppe">
  <header>
    <h1 id="titre">Schéma — travail en cours</h1>
    <span class="pouls"><span class="point"></span><span id="maj">—</span></span>
  </header>

  <div class="grille" id="kpis"></div>

  <h2>Le cœur chaud du graphe</h2>
  <div class="chaud" id="chaud"></div>

  <h2>Phases</h2>
  <div class="bloc" id="phases"></div>

  <h2>Journal</h2>
  <div class="bloc"><ol class="journal" id="journal"></ol></div>

  <h2>Fichiers touchés</h2>
  <div class="bloc"><ol class="journal" id="fichiers"></ol></div>

  <footer>Rafraîchi seul toutes les 4 s · source <code>docs/equipes/live/etat.json</code></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const nb = (n) => (n ?? 0).toLocaleString('fr-FR');

function peindre(d){
  $('titre').textContent = d.mission || 'Travail en cours';
  $('maj').textContent = d.maj || new Date().toLocaleTimeString('fr-FR');

  const m = d.mesures || {};
  $('kpis').innerHTML = [
    ['tables', m.tables, ''],
    ['colonnes de jointure', m.colonnes_id, ''],
    ['sans index', m.sans_index, 'alerte'],
    ['sans clé étrangère', m.sans_fk, 'alerte'],
    ['nœuds du graphe', m.noeuds_graphe, ''],
  ].map(([l,v,c]) => `<div class="kpi ${c}"><b>${nb(v)}</b><span>${l}</span></div>`).join('');

  $('chaud').innerHTML = (d.coeur_chaud||[]).map(t =>
    `<span class="jeton">${t.nom} <b>${nb(t.liens)}</b></span>`).join('') || '<span class="vide">—</span>';

  $('phases').innerHTML = (d.phases||[]).map(p => `
    <div class="ligne">
      <span class="puce ${p.etat}"></span>
      <div><strong>${p.nom}</strong><em>${p.detail||''}</em></div>
      <span class="etat">${p.etat==='fait'?'terminé':p.etat==='encours'?'en cours':'à venir'}</span>
    </div>`).join('') || '<div class="vide">—</div>';

  const j = (d.journal||[]).slice().reverse();
  $('journal').innerHTML = j.map(e => `<li>${e.quoi}</li>`).join('') || '<div class="vide">Rien encore.</div>';

  const f = (d.fichiers||[]).slice().reverse();
  $('fichiers').innerHTML = f.map(e => `<li><code>${e.chemin||e}</code>${e.quoi?' — '+e.quoi:''}</li>`).join('')
    || '<div class="vide">Aucun fichier modifié pour l’instant.</div>';
}

async function tick(){
  try{
    const r = await fetch('etat.json?_=' + Date.now(), {cache:'no-store'});
    if(r.ok) peindre(await r.json());
  }catch(e){ /* le serveur redémarre : on réessaiera */ }
}
tick(); setInterval(tick, 4000);
</script>
</body>
</html>
